services:
  aiogames:
    image: ${AIOGAMES_IMAGE:-ghcr.io/lukewarmsodas/aiogames:latest}
    # The image builds with USER nextjs (uid 1001), so the bind mounts below
    # would each have to be writable by that uid. Running as root instead means
    # the host paths need no ownership changes. Drop this line to fall back to
    # uid 1001 and chown the mounts on the host.
    user: "0:0"
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - LIBRARY_ROOT=/library/games
      - JD2_AUTO_DOWNLOADS_ENABLED=true
      - JD2_FOLDERWATCH_DIR=/jd2/folderwatch
      - JD2_DOWNLOAD_ROOT=/downloads/games
      # Stated explicitly rather than relying on the code defaults.
      # autoConfirm moves links from the LinkGrabber into the download list;
      # autoStart begins the download once they are there.
      - JD2_AUTO_CONFIRM=true
      - JD2_AUTO_START=true
      # When true, JD2_DOWNLOAD_ROOT wins over any Packagizer folder rule.
      # Left false to preserve existing behaviour - set it if downloads are not
      # landing under JD2_DOWNLOAD_ROOT.
      - JD2_OVERWRITE_PACKAGIZER=false
    env_file: 
      - stack.env  # stack.env or .env
      #- .env
    volumes:
      - /mnt/main/games:/library/games:ro
      - /mnt/main/downloads:/downloads/games
      # The JDownloader container must mount this same host path and have it in
      # its Folder Watch folder list, otherwise crawljobs are written here and
      # nothing ever consumes them. JD2 usually runs from a separate stack, e.g.
      #   jdownloader-2:
      #     volumes:
      #       - /mnt/main/downloads/watch:/watch
      # then add /watch under Settings -> Extensions -> Folder Watch in JD2.
      # scripts/diagnose-jd2.sh reports whether that mount exists.
      - /mnt/main/downloads/watch:/jd2/folderwatch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
