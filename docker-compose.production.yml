services:
  aiogames:
    image: ${AIOGAMES_IMAGE:-ghcr.io/lukewarmsodas/aiogames:latest}
    # The image builds with USER nextjs (uid 1001), so the bind mounts below
    # would each have to be writable by that uid. Running as root instead means
    # the host paths need no ownership changes. Drop this line to fall back to
    # uid 1001 and chown the mounts on the host.
    user: "0:0"
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - LIBRARY_ROOT=/library/games
      - JD2_AUTO_DOWNLOADS_ENABLED=true
      # A path inside the JDownloader container, passed through its API.
      # Package names do not create subdirectories; /output is the jlesage default.
      - JD2_DOWNLOAD_ROOT=/output
      - JD2_AUTO_START=true
      # When true, JD2_DOWNLOAD_ROOT wins over any Packagizer folder rule.
      # Left false to preserve existing behaviour - set it if downloads are not
      # landing under JD2_DOWNLOAD_ROOT.
      - JD2_OVERWRITE_PACKAGIZER=false
      # MyJDownloader credentials are primary. The local API is used only when
      # the credential connection is unavailable. Credentials and fallback URL
      # are loaded from stack.env so empty Compose defaults cannot override them.
      - JD2_DEVICE_NAME=JDownloader@Docker
      - JD2_MONITOR_INTERVAL_MS=60000
      - JD2_STALL_MINUTES=15
      - JD2_MISSING_JOB_MINUTES=10
      - JD2_FALLBACK_ON_CAPTCHA=false
      # Magnet / .torrent links are handed to qBittorrent instead of JD2.
      # Reachable by service name when both share a docker network, same as
      # FlareSolverr. Credentials go in stack.env, not here.
      - QBITTORRENT_URL=http://qbitvpn:8080
      - QBIT_CATEGORY=games
      - QBIT_TAGS=aiogames
    env_file: 
      - stack.env  # stack.env or .env
      #- .env
    volumes:
      - /mnt/main/games:/library/games:ro
      - /mnt/main/downloads:/downloads/games
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
